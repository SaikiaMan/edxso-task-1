services:
  app:
    build: .
    ports: ["127.0.0.1:8501:8501"]
    env_file: .env
    volumes: ["./data:/app/data"]
    restart: unless-stopped
  scheduler:
    build: .
    command: ["python", "-m", "signalstack.scheduler"]
    env_file: .env
    volumes: ["./data:/app/data"]
    restart: unless-stopped
